; Standalone ESP-SDR scanner for the CYD (ESP32-2432S028).
; Uses the undocumented ESP32 raw I/Q capture path (ESP-SDR / ESPARGOS),
; on-chip FFT and a LovyanGFX spectrum + waterfall UI. No PC required.
;
; Build:  ../.venv/bin/pio run -e cyd-sdr
; Flash:  ../.venv/bin/pio run -e cyd-sdr -t upload

[platformio]
default_envs = cyd-sdr

[env:cyd-sdr]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
upload_speed = 921600
; The CYD's CH340 is /dev/ttyUSB0 on Linux. Set it here if auto-detect picks
; the wrong port (it tends to grab /dev/ttyS0):
;   upload_port = /dev/ttyUSB0
; or pass it per run: pio run -e cyd-sdr -t upload --upload-port /dev/ttyUSB0
board_build.partitions = partitions.csv
; LovyanGFX from the registry (1.3.0 was the version verified on hardware).
; The vendored copy was 179 MB of unused CJK fonts; do not re-vendor it.
lib_deps = lovyan03/LovyanGFX@1.3.0
build_flags =
    -Wno-unused-variable
    -Wno-unused-but-set-variable
